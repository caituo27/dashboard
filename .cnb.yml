$:
  push:
    - docker:
        image: node:22
        volumes:
          - /root/.pnpm-store:copy-on-write
      stages:
        - name: 校验部署参数
          script: |
            set -eu

            test -n "${SPRIX_PORTAL_SSH_HOST:-}"
            test -n "${SPRIX_PORTAL_SSH_USER:-}"
            test -n "${SPRIX_PORTAL_SSH_PORT:-}"
            test -n "${SPRIX_PORTAL_SSH_PRIVATE_KEY:-}"
            test -n "${SPRIX_PORTAL_AGENT_WEB_ROOT:-}"
            test -n "${SPRIX_PORTAL_ADMIN_WEB_ROOT:-}"

            echo "部署目标服务器: ${SPRIX_PORTAL_SSH_HOST}"
            echo "C 端目录: ${SPRIX_PORTAL_AGENT_WEB_ROOT}"
            echo "管理后台目录: ${SPRIX_PORTAL_ADMIN_WEB_ROOT}"

        - name: 安装依赖
          script: |
            set -eu

            corepack enable
            corepack prepare pnpm@10.32.1 --activate
            pnpm install --frozen-lockfile

        - name: 构建前端
          script: |
            set -eu

            export VITE_API_BASE_URL="${SPRIX_PORTAL_API_BASE_URL:-/sprix-api}"

            pnpm --filter @sprix-ai/agent build
            pnpm --filter @sprix-ai/admin build

            rm -rf target/cnb-deploy
            mkdir -p target/cnb-deploy/agent target/cnb-deploy/admin
            cp -R apps/sprix-agent/dist/. target/cnb-deploy/agent/
            cp -R apps/sprix-admin/dist/. target/cnb-deploy/admin/

            test -f target/cnb-deploy/agent/index.html
            test -f target/cnb-deploy/admin/index.html

        - name: 部署 C 端到服务器
          image: tencentcom/rsync
          settings:
            user: $SPRIX_PORTAL_SSH_USER
            port: $SPRIX_PORTAL_SSH_PORT
            key: $SPRIX_PORTAL_SSH_PRIVATE_KEY
            hosts:
              - $SPRIX_PORTAL_SSH_HOST
            source: ./target/cnb-deploy/agent/
            target: $SPRIX_PORTAL_AGENT_WEB_ROOT/
            ssh_args: >-
              -o IdentitiesOnly=yes
              -o StrictHostKeyChecking=accept-new

        - name: 部署管理后台到服务器
          image: tencentcom/rsync
          settings:
            user: $SPRIX_PORTAL_SSH_USER
            port: $SPRIX_PORTAL_SSH_PORT
            key: $SPRIX_PORTAL_SSH_PRIVATE_KEY
            hosts:
              - $SPRIX_PORTAL_SSH_HOST
            source: ./target/cnb-deploy/admin/
            target: $SPRIX_PORTAL_ADMIN_WEB_ROOT/
            ssh_args: >-
              -o IdentitiesOnly=yes
              -o StrictHostKeyChecking=accept-new
